[mypy]
python_version = 3.13

strict_optional = True
disallow_untyped_defs = True
warn_unused_configs = True
disable_error_code = arg-type, operator

[mypy-celery.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-app.celery_app]
ignore_missing_imports = True

[mypy-app.tasks]
ignore_missing_imports = True